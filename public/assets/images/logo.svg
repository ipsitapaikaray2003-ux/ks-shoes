<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F5D882"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="50%" stop-color="#E8C97A"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#C9A84C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(6, 6)">
    <!-- Outer Octagonal / Diamond Crest -->
    <rect x="2" y="2" width="44" height="44" rx="10" transform="rotate(0 24 24)" stroke="url(#goldRing)" stroke-width="1.5" fill="#111111" fill-opacity="0.8"/>
    <rect x="5" y="5" width="38" height="38" rx="8" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 2" fill="none" opacity="0.6"/>
    
    <!-- Monogram Letters K & S -->
    <g filter="url(#goldGlow)">
      <!-- Letter K -->
      <path d="M16 14v20M16 24l8-10M19.5 20.5l6.5 13.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Letter S -->
      <path d="M33 16.5c-2.2-1.5-5.5-1.2-6.5.8-.8 1.6.2 3.2 2.2 4.2l2.6 1.3c2.2 1.1 3.2 2.8 2.4 4.7-1 2.4-4.8 2.8-7.7 1.2" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Typographic Wordmark -->
  <g transform="translate(64, 14)">
    <!-- Main Brand Name -->
    <text x="0" y="16" font-family="'Montserrat', 'Cinzel', 'Playfair Display', sans-serif" font-size="18" font-weight="900" letter-spacing="2.8" fill="url(#goldGrad)">KS ENTERPRISE</text>
    
    <!-- Slogan & Sub-label -->
    <text x="0.5" y="30" font-family="'Inter', 'Montserrat', sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.8" fill="#D0D0D0" opacity="0.85">WALK A BETTER TOMORROW</text>
    
    <!-- Fine Gold Accent Line -->
    <line x1="0" y1="36" x2="165" y2="36" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.5"/>
  </g>
</svg>
